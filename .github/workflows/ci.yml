name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NUCKTY_CORE_REF: ${{ vars.NUCKTY_CORE_REF }}
    steps:
      - name: Require a pinned compatible core commit
        shell: bash
        run: |
          if [[ ! "$NUCKTY_CORE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "NUCKTY_CORE_REF must be configured as the compatible nuckty/nuckty 40-character commit SHA." >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: project
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: nuckty/nuckty
          ref: ${{ env.NUCKTY_CORE_REF }}
          path: nuckty
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            nuckty/package-lock.json
            project/package-lock.json
      - name: Verify release automation guards
        run: node --test project/config/npm-release.test.mjs
      - name: Install and build pinned core
        working-directory: nuckty
        run: |
          npm ci --no-audit --no-fund --registry=https://registry.npmjs.org
          npm audit --package-lock-only --audit-level=low --registry=https://registry.npmjs.org
          npm run build
      - name: Install extension dependencies
        working-directory: project
        run: |
          npm ci --no-audit --no-fund --registry=https://registry.npmjs.org
          npm audit --package-lock-only --audit-level=low --registry=https://registry.npmjs.org
      - name: Lint, build, and test extension
        working-directory: project
        run: |
          npm run lint
          npm run build
          npm test

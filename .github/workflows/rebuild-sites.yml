name: Rebuild public sites

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions: {}

concurrency:
  group: rebuild-public-sites
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && vars.NUCKTY_REBUILD_APP_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create token limited to consumer Actions
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.NUCKTY_REBUILD_APP_ID }}
          private-key: ${{ secrets.NUCKTY_REBUILD_APP_PRIVATE_KEY }}
          owner: nuckty
          repositories: |
            nuckty-site
            nuckty-demo
          permission-actions: write
      - name: Rebuild and deploy both consumers through their CI
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          for repository in nuckty-site nuckty-demo; do
            gh api --method POST "repos/nuckty/$repository/actions/workflows/ci.yml/dispatches" -f ref=main
          done
